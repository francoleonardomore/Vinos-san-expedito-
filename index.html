<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinoteca & Regionales | Sabores de Mendoza</title>
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #581845; /* Tono vino / borgoña */
            --secondary: #900C3F;
            --accent: #C70039;
            --dark: #2C3E50;
            --light: #F9F9F9;
            --white: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--light);
            color: var(--dark);
        }

        /* Header */
        header {
            background-color: var(--primary);
            color: var(--white);
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .logo h1 {
            font-size: 1.8rem;
            letter-spacing: 1px;
        }

        .logo p {
            font-size: 0.85rem;
            color: #ddd;
        }

        #cart-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        #cart-btn:hover {
            background: #a8002e;
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1510812431401-41d2bd2722f3?auto=format&fit=crop&w=1200&q=80') center/cover;
            color: white;
            text-align: center;
            padding: 4rem 1rem;
        }

        .hero h2 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }

        .hero p {
            font-size: 1.1rem;
            color: #eee;
        }

        /* Filtros y Buscador */
        .filters-container {
            max-width: 1100px;
            margin: 2rem auto 1rem;
            padding: 0 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        #search-input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
        }

        .categories {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }

        .cat-btn {
            background: white;
            border: 1px solid #ddd;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .cat-btn.active, .cat-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Productos */
        .products-grid {
            max-width: 1100px;
            margin: 0 auto 3rem;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .product-info {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .product-info h4 {
            font-size: 1.1rem;
            margin-bottom: 0.3rem;
        }

        .product-info .category-tag {
            font-size: 0.75rem;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .product-info .price {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--secondary);
            margin-bottom: 1rem;
        }

        .add-to-cart {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.6rem;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        .add-to-cart:hover {
            background: var(--secondary);
        }

        /* Modal del Carrito */
        .cart-modal {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 400px;
            height: 100%;
            background: white;
            box-shadow: -4px 0 15px rgba(0,0,0,0.1);
            transition: right 0.3s ease;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        .cart-modal.open {
            right: 0;
        }

        .cart-content {
            padding: 2rem;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        #close-cart {
            background: none;
            border: none;
            font-size: 2rem;
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            cursor: pointer;
        }

        .cart-total {
            margin-top: auto;
            border-top: 1px solid #eee;
            padding-top: 1rem;
        }

        #checkout-whatsapp {
            background: #25D366;
            color: white;
            border: none;
            width: 100%;
            padding: 0.8rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        #checkout-whatsapp:hover {
            background: #20ba5a;
        }

        footer {
            text-align: center;
            padding: 2rem;
            background: #222;
            color: #aaa;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- Header / Barra Superior -->
    <header>
        <div class="logo">
            <h1>🍷 Aromas de Cuyo</h1>
            <p>Vinoteca & Productos Regionales</p>
        </div>
        <div class="header-actions">
            <button id="cart-btn"><i class="fa-solid fa-cart-shopping"></i> <span id="cart-count">0</span></button>
        </div>
    </header>

    <!-- Portada / Hero -->
    <section class="hero">
        <div class="hero-content">
            <h2>Lo mejor de Mendoza en tu mesa</h2>
            <p>Vinos de altura, aceites de oliva, chocolates artesanales y regalería exclusiva.</p>
        </div>
    </section>

    <!-- Filtros y Buscador -->
    <section class="filters-container">
        <input type="text" id="search-input" placeholder="🔍 Buscá tu vino, chocolate, aceitunas...">
        <div class="categories">
            <button class="cat-btn active" data-category="all">Todos</button>
            <button class="cat-btn" data-category="vinos">Vinos & Espumantes</button>
            <button class="cat-btn" data-category="almacen">Almacén & Olivos</button>
            <button class="cat-btn" data-category="dulces">Dulces & Chocolates</button>
            <button class="cat-btn" data-category="regaleria">Regalería</button>
        </div>
    </section>

    <!-- Grilla de Productos -->
    <main class="products-grid" id="products-container">
        <!-- Los productos se cargan dinámicamente con JavaScript -->
    </main>

    <!-- Carrito Flotante / Panel Lateral -->
    <div class="cart-modal" id="cart-modal">
        <div class="cart-content">
            <button id="close-cart">&times;</button>
            <h3>Tu Pedido Regional</h3>
            <div id="cart-items">
                <!-- Ítems seleccionados -->
            </div>
            <div class="cart-total">
                <p>Total: $<span id="cart-total-price">0</span></p>
                <button id="checkout-whatsapp"><i class="fa-brands fa-whatsapp"></i> Enviar pedido por WhatsApp</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Vinoteca & Regionales Mendoza. Hecho con pasión.</p>
    </footer>

    <script>
        const products = [
            { id: 1, name: "Vino Malbec Reserva", category: "vinos", price: 8500, image: "https://images.unsplash.com/photo-1510812431401-41d2bd2722f3?auto=format&fit=crop&w=500&q=80" },
            { id: 2, name: "Vino Cabernet Sauvignon", category: "vinos", price: 7800, image: "https://images.unsplash.com/photo-1506377247377-2a5b3b417ebb?auto=format&fit=crop&w=500&q=80" },
            { id: 3, name: "Vino Espumante Extra Brut", category: "vinos", price: 9200, image: "https://images.unsplash.com/photo-1575444758702-4a6b9222336e?auto=format&fit=crop&w=500&q=80" },
            { id: 4, name: "Aceite de Oliva Extra Virgen (500ml)", category: "almacen", price: 6500, image: "https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?auto=format&fit=crop&w=500&q=80" },
            { id: 5, name: "Aceitunas Verdes Rellenas (Frasco)", category: "almacen", price: 3400, image: "https://images.unsplash.com/photo-1541592106381-b31e9677c0e5?auto=format&fit=crop&w=500&q=80" },
            { id: 6, name: "Chocolate en Rama Artesanal (200g)", category: "dulces", price: 4200, image: "https://images.unsplash.com/photo-1549007994-cb92caebd54b?auto=format&fit=crop&w=500&q=80" },
            { id: 7, name: "Alfajores Regionales de Nuez (x6)", category: "dulces", price: 5000, image: "https://images.unsplash.com/photo-1609149041275-5853ee4c1303?auto=format&fit=crop&w=500&q=80" },
            { id: 8, name: "Dulce de Mermelada Artesanal de Durazno", category: "dulces", price: 2900, image: "https://images.unsplash.com/photo-1587314168485-3236d6710814?auto=format&fit=crop&w=500&q=80" },
            { id: 9, name: "Cuchillo Artesanal con Cabo de Madera", category: "regaleria", price: 14500, image: "https://images.unsplash.com/photo-1593618998160-e34014e67546?auto=format&fit=crop&w=500&q=80" },
            { id: 10, name: "Sacacorchos Profesional de Madera", category: "regaleria", price: 4800, image: "https://images.unsplash.com/photo-1556910103-1c02745aae4d?auto=format&fit=crop&w=500&q=80" }
        ];

        let cart = [];

        const productsContainer = document.getElementById("products-container");
        const searchInput = document.getElementById("search-input");
        const categoryButtons = document.querySelectorAll(".cat-btn");
        const cartBtn = document.getElementById("cart-btn");
        const cartModal = document.getElementById("cart-modal");
        const closeCart = document.getElementById("close-cart");
        const cartItemsContainer = document.getElementById("cart-items");
        const cartCount = document.getElementById("cart-count");
        const cartTotalPrice = document.getElementById("cart-total-price");
        const checkoutWhatsapp = document.getElementById("checkout-whatsapp");

        function displayProducts(productsToDisplay) {
            productsContainer.innerHTML = "";
            if (productsToDisplay.length === 0) {
                productsContainer.innerHTML = `<p style="grid-column: 1/-1; text-align:center; padding: 2rem;">No se encontraron productos.</p>`;
                return;
            }

            productsToDisplay.forEach(product => {
                const card = document.createElement("div");
                card.classList.add("product-card");
                card.innerHTML = `
                    <img src="${product.image}" alt="${product.name}">
                    <div class="product-info">
                        <div>
                            <span class="category-tag">${product.category}</span>
                            <h4>${product.name}</h4>
                        </div>
                        <div>
                            <p class="price">$${product.price.toLocaleString()}</p>
                            <button class="add-to-cart" onclick="addToCart(${product.id})">Agregar al pedido</button>
                        </div>
                    </div>
                `;
                productsContainer.appendChild(card);
            });
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const existingItem = cart.find(item => item.id === id);

            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCart();
        }

        function updateCart() {
            cartItemsContainer.innerHTML = "";
            let total = 0;
            let count = 0;

            cart.forEach(item => {
                total += item.price * item.quantity;
                count += item.quantity;

                const cartItem = document.createElement("div");
                cartItem.style.display = "flex";
                cartItem.style.justifyContent = "space-between";
                cartItem.style.alignItems = "center";
                cartItem.style.marginBottom = "1rem";
                cartItem.innerHTML = `
                    <div>
                        <p style="font-weight:600;">${item.name}</p>
                        <small>$${item.price} x ${item.quantity}</small>
                    </div>
                    <button onclick="removeFromCart(${item.id})" style="background:none; border:none; color:red; cursor:pointer;"><i class="fa-solid fa-trash"></i></button>
                `;
                cartItemsContainer.appendChild(cartItem);
            });

            cartCount.textContent = count;
            cartTotalPrice.textContent = total.toLocaleString();
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            updateCart();
        }

        categoryButtons.forEach(button => {
            button.addEventListener("click", (e) => {
                categoryButtons.forEach(btn => btn.classList.remove("active"));
                e.target.classList.add("active");

                const category = e.target.dataset.category;
                if (category === "all") {
                    displayProducts(products);
                } else {
                    const filtered = products.filter(p => p.category === category);
                    displayProducts(filtered);
                }
            });
        });

        searchInput.addEventListener("input", (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(term));
            displayProducts(filtered);
        });

        cartBtn.addEventListener("click", () => cartModal.classList.add("open"));
        closeCart.addEventListener("click", () => cartModal.classList.remove("open"));

        checkoutWhatsapp.addEventListener("click", () => {
            if (cart.length === 0) {
                alert("Tu carrito está vacío.");
                return;
            }

            let message = "Hola! Quiero hacer el siguiente pedido de la vinoteca:\n\n";
            let total = 0;

            cart.forEach(item => {
                message += `- ${item.quantity}x ${item.name} ($${item.price * item.quantity})\n`;
                total += item.price * item.quantity;
            });

            message += `\n*Total a abonar: $${total.toLocaleString()}*\n\n¡Espero confirmación para coordinar el pago y retiro/envío!`;

            const telefono = "5492614701888"; 
            const url = `https://wa.me/${telefono}?text=${encodeURIComponent(message)}`;
            window.open(url, "_blank");
        });

        displayProducts(products);
    </script>
</body>
</html>
